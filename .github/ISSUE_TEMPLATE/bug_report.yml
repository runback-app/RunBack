name: Report a bug
description: Record a RunBack problem so Sanjay and Nick can reproduce it.
title: "Bug: "
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the page and the steps that led to the problem. Omit passwords, reset links, keys, and private chat contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or computer and browser
      placeholder: iPhone Safari, Android Chrome, or desktop Chrome
  - type: input
    id: time
    attributes:
      label: Approximate time in Tucson
