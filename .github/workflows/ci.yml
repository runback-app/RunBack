name: Checks

# Runs on every push and pull request. If anything fails, GitHub shows a red X on the commit.
# On pushes to main, the site goes live only after every check passes.
on:
  push:
    branches: [main]
  pull_request:
  # Lets either of us redeploy by hand: Actions tab → Checks → Run workflow.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build

  # Deploys from here because Vercel's free plan won't deploy straight from a
  # private repo owned by a GitHub organization. Needs the VERCEL_TOKEN secret.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_FusnTNe1maWkO65xoxBQeKPb
      VERCEL_PROJECT_ID: prj_YQLqykqiUqYTIfYsbMqotLHMS3mD
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Make sure the Vercel token is set
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::error::The VERCEL_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions, then re-run this job."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm install --global vercel@latest
      - name: Get Vercel settings and env vars
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
